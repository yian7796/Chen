<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#dfefff"/>
    <stop offset="100%" stop-color="#f6f9ff"/>
  </linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<rect y="500" width="1280" height="220" fill="#d9c7a1"/>
<text x="640" y="70" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#2f3b52">AI 軍團軍營預覽圖（可直接查看）</text>

<!-- central command tent -->
<polygon points="520,470 760,470 700,300 580,300" fill="#c88f5d" stroke="#6d4b2f" stroke-width="3"/>
<rect x="560" y="470" width="160" height="90" fill="#b77d49" stroke="#6d4b2f" stroke-width="3"/>
<text x="640" y="360" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#fff">主公指揮帳</text>
<rect x="595" y="390" width="90" height="56" rx="6" fill="#2e3a5f"/>
<text x="640" y="423" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#d1f0ff">戰略看板</text>

<!-- left tents -->
<polygon points="220,500 380,500 340,390 260,390" fill="#7ea2c8" stroke="#39536f" stroke-width="3"/>
<text x="300" y="440" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#fff">趙雲 趨勢斥候</text>

<polygon points="140,620 300,620 260,520 180,520" fill="#8da66f" stroke="#465638" stroke-width="3"/>
<text x="220" y="565" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#fff">龐統 會議書記</text>

<!-- right tents -->
<polygon points="900,500 1060,500 1020,390 940,390" fill="#9a8cc6" stroke="#4f4672" stroke-width="3"/>
<text x="980" y="440" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#fff">司馬懿 財務主簿</text>

<polygon points="980,620 1140,620 1100,520 1020,520" fill="#d59ab1" stroke="#7a4d62" stroke-width="3"/>
<text x="1060" y="565" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#fff">大喬 視覺工官</text>

<!-- back platform -->
<rect x="540" y="250" width="200" height="45" fill="#8b6a47" stroke="#5e432a" stroke-width="3"/>
<text x="640" y="280" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#fff">諸葛亮 戰略軍師</text>

<!-- front table -->
<rect x="470" y="590" width="340" height="60" rx="8" fill="#7f5d3a" stroke="#4b341f" stroke-width="3"/>
<text x="640" y="626" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#fff">周瑜 PPT 文官（簡報桌）</text>

</svg>