<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#60a5fa" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 44px 'Noto Sans TC', sans-serif; fill: #e2e8f0; }
      .sub { font: 400 20px 'Noto Sans TC', sans-serif; fill: #94a3b8; }
      .cardTitle { font: 700 22px 'Noto Sans TC', sans-serif; fill: #f8fafc; }
      .cardSub { font: 400 16px 'Noto Sans TC', sans-serif; fill: #cbd5e1; }
      .node { fill: url(#panel); stroke: #334155; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" class="title">AI 軍團｜作戰中樞視覺圖</text>
  <text x="800" y="108" text-anchor="middle" class="sub">Premium Preview · Strategy / Finance / Ops / Presentation / Visual</text>

  <!-- center command -->
  <g filter="url(#glow)">
    <rect x="620" y="330" width="360" height="220" class="node"/>
    <text x="800" y="408" text-anchor="middle" class="cardTitle">諸葛亮｜戰略軍師</text>
    <text x="800" y="442" text-anchor="middle" class="cardSub">Strategy Interpretation & Decision Engine</text>
    <rect x="705" y="470" width="190" height="38" rx="10" fill="#2563eb"/>
    <text x="800" y="496" text-anchor="middle" class="cardSub" fill="#fff">主公指揮中樞</text>
  </g>

  <!-- left column -->
  <rect x="120" y="220" width="340" height="160" class="node"/>
  <text x="290" y="284" text-anchor="middle" class="cardTitle">趙雲｜趨勢斥候</text>
  <text x="290" y="318" text-anchor="middle" class="cardSub">External Signals · Market Radar</text>

  <rect x="120" y="520" width="340" height="160" class="node"/>
  <text x="290" y="584" text-anchor="middle" class="cardTitle">龐統｜會議書記</text>
  <text x="290" y="618" text-anchor="middle" class="cardSub">Decision Notes · Action Tracker</text>

  <!-- right column -->
  <rect x="1140" y="220" width="340" height="160" class="node"/>
  <text x="1310" y="284" text-anchor="middle" class="cardTitle">司馬懿｜財務主簿</text>
  <text x="1310" y="318" text-anchor="middle" class="cardSub">Finance Signals · Risk Control</text>

  <rect x="1140" y="520" width="340" height="160" class="node"/>
  <text x="1310" y="584" text-anchor="middle" class="cardTitle">大喬｜視覺工官</text>
  <text x="1310" y="618" text-anchor="middle" class="cardSub">Visualization · Design System</text>

  <!-- bottom row -->
  <rect x="560" y="700" width="480" height="120" class="node"/>
  <text x="800" y="750" text-anchor="middle" class="cardTitle">周瑜｜PPT 文官</text>
  <text x="800" y="784" text-anchor="middle" class="cardSub">Executive Narrative · Deck Architecture</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="3" fill="none" opacity="0.8">
    <path d="M460 300 C540 300, 560 360, 620 400"/>
    <path d="M1140 300 C1060 300, 1040 360, 980 400"/>
    <path d="M460 600 C540 600, 560 520, 620 470"/>
    <path d="M1140 600 C1060 600, 1040 520, 980 470"/>
    <path d="M800 550 L800 700"/>
  </g>

  <rect x="20" y="20" width="1560" height="860" rx="22" fill="none" stroke="#334155" stroke-width="2"/>
</svg>
