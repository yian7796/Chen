<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8ff"/>
      <stop offset="60%" stop-color="#e9f3ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c5a0"/>
      <stop offset="100%" stop-color="#b58f63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="560" width="1600" height="340" fill="url(#ground)"/>

  <text x="800" y="72" text-anchor="middle" font-size="44" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#25324a" font-weight="700">AI 軍團 · 三國軍營作戰中心</text>
  <text x="800" y="108" text-anchor="middle" font-size="22" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#4a5f84">Legion Command Layout Preview</text>

  <!-- main command tent -->
  <g filter="url(#shadow)">
    <polygon points="650,560 950,560 880,325 720,325" fill="#c8824f" stroke="#6c4123" stroke-width="4"/>
    <rect x="705" y="560" width="190" height="120" rx="8" fill="#ad6e40" stroke="#6c4123" stroke-width="4"/>
    <rect x="744" y="413" width="112" height="72" rx="8" fill="#27385a" stroke="#9fc9ff" stroke-width="3"/>
    <text x="800" y="455" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#dbf3ff">戰略看板</text>
  </g>
  <text x="800" y="355" text-anchor="middle" font-size="26" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#ffffff" font-weight="700">主公指揮帳</text>

  <!-- top platform -->
  <g filter="url(#shadow)">
    <rect x="700" y="250" width="200" height="54" rx="10" fill="#866244" stroke="#563a25" stroke-width="3"/>
    <text x="800" y="285" text-anchor="middle" font-size="22" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">諸葛亮｜戰略軍師</text>
  </g>

  <!-- left side tents -->
  <g filter="url(#shadow)">
    <polygon points="220,585 460,585 400,430 280,430" fill="#6e95c2" stroke="#35506f" stroke-width="4"/>
    <rect x="265" y="585" width="150" height="90" rx="8" fill="#547ea8" stroke="#35506f" stroke-width="3"/>
  </g>
  <text x="340" y="500" text-anchor="middle" font-size="24" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">趙雲</text>
  <text x="340" y="530" text-anchor="middle" font-size="18" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#e7f3ff">外部趨勢斥候</text>

  <g filter="url(#shadow)">
    <polygon points="120,760 360,760 300,620 180,620" fill="#6a8a57" stroke="#3f5432" stroke-width="4"/>
  </g>
  <text x="240" y="690" text-anchor="middle" font-size="24" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">龐統</text>
  <text x="240" y="720" text-anchor="middle" font-size="18" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#eaf7e2">會議書記</text>

  <!-- right side tents -->
  <g filter="url(#shadow)">
    <polygon points="1140,585 1380,585 1320,430 1200,430" fill="#8b7fb9" stroke="#4d4570" stroke-width="4"/>
    <rect x="1185" y="585" width="150" height="90" rx="8" fill="#7469a2" stroke="#4d4570" stroke-width="3"/>
  </g>
  <text x="1260" y="500" text-anchor="middle" font-size="24" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">司馬懿</text>
  <text x="1260" y="530" text-anchor="middle" font-size="18" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#f0ecff">財務主簿</text>

  <g filter="url(#shadow)">
    <polygon points="1240,760 1480,760 1420,620 1300,620" fill="#c58da5" stroke="#6f4254" stroke-width="4"/>
  </g>
  <text x="1360" y="690" text-anchor="middle" font-size="24" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">大喬</text>
  <text x="1360" y="720" text-anchor="middle" font-size="18" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#ffeef4">視覺工官</text>

  <!-- front workstations -->
  <g filter="url(#shadow)">
    <rect x="520" y="740" width="260" height="76" rx="14" fill="#7a5636" stroke="#4c331e" stroke-width="3"/>
    <rect x="820" y="740" width="260" height="76" rx="14" fill="#7a5636" stroke="#4c331e" stroke-width="3"/>
  </g>
  <text x="650" y="786" text-anchor="middle" font-size="22" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">周瑜｜PPT 文官</text>
  <text x="950" y="786" text-anchor="middle" font-size="22" font-family="PingFang TC, Noto Sans TC, sans-serif" fill="#fff">營運任務台</text>

  <!-- subtle border -->
  <rect x="14" y="14" width="1572" height="872" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
</svg>
